title: How to MUDE?
author: MUDE from Delft University of Technology
logo: _static/MUDE_Logo-small.png

execute:
  execute_notebooks: "off"

only_build_toc_files: true

html:
  baseurl :  "https://mude.citg.tudelft.nl/teacher/feedback" #Replace this with your own URL

sphinx:
  config:
    teachbooks_favourites_exclude:
      - teachbooks_sphinx_tippy
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    - bugdrop-loader.js
    thebe_config:
      use_thebe_lite: true
      exclude_patterns: ["**/_*.yml", "**/*.md", "**/*.ipynb"]
    html_theme_options:
      logo:
        text: How to MUDE?
        link: "https://mude.citg.tudelft.nl/"
      repository_url: "https://github.com/TUDelft-MUDE/teacher" #add your own repo URL here
      path_to_docs: "book"
      repository_branch: "main"
      use_edit_page_button: true
      use_repository_button: true
      use_issues_button : true
      launch_buttons:
        thebe: true
    named_colors_custom_colors: {'attributiongrey':[150,150,150]}
    html_show_copyright: false
    html_last_updated_fmt: '%B %-d, %Y'
    mathjax3_config:
      chtml: {
        mtextInheritFont: true # To typeset text within math prettier
      }
    tud_change_logo: false
  extra_extensions:
    - sphinx.ext.imgconverter
    - sphinx.ext.extlinks
    - teachbooks_favourites
    - sphinx_tudelft_theme

bibtex_bibfiles: 
  - references.bib
